# Single-service deployment for the chemistry pipeline UI.
#
# Run on a GPU host:
#   docker compose up --build
#   open http://<host>:8080
#
# v1 doesn't enable GPU because the bundled image only includes the main
# Python venv (no MolDetect / MolNexTR). When you add those venvs to the
# Dockerfile, switch the base to nvidia/cuda:12.x-runtime-ubuntu22.04 and
# uncomment the `deploy.resources.reservations.devices` block below.

services:
  app:
    build: .
    image: collective-autogen-ui
    ports:
      - "8080:8000"
    env_file:
      - .env  # OPENAI_API_KEY, AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY, ...
    volumes:
      # Pipeline outputs and uploads are persisted on the host.
      - ./runs:/app/runs
      - ./webapp/uploads:/app/webapp/uploads
      # Mount Florence-2 / MolDetect checkpoints in if you have them locally:
      # - ./molnextr:/app/molnextr:ro
    restart: unless-stopped

    # Uncomment when bundling MolDetect / MolNexTR and switching to a CUDA base:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
